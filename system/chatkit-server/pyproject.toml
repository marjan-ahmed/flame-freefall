[project]
name = "chatkit-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.17.0",
    "openai-agents>=0.22.3",
    "openai-chatkit>=1.6.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
    "asyncpg>=0.29.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# chatkit marks direct widget classes deprecated (in favor of .widget
# templates); psi_widgets.py uses them deliberately — see its docstring.
filterwarnings = ["ignore:Direct usage of named widget classes is deprecated:DeprecationWarning"]
