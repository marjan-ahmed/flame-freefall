[project]
name = "psi-ingest"
version = "0.1.0"
description = "Normalizes NASA PSI microgravity-combustion test tables into one provenance-preserving run table"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
]

[project.scripts]
psi-ingest = "psi_ingest.cli:main"
psi-extract = "psi_ingest.extract:main"
psi-inventory = "psi_ingest.inventory:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psi_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
