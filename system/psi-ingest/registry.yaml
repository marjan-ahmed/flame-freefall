# Investigation registry — identity metadata only, never science values.
#
# `full_name` is filled ONLY where a governed knowledge/ document states it;
# otherwise it is null and the short name stands alone. Report citations are
# never written here: `ksor_doc` + `source_id` point at a knowledge document's
# own `sources:` frontmatter, which the ingest reads at run time (so a
# citation's title and URL have exactly one home — the record).
#
# `geometry_class` reuses the corpus's comparability classes (AGENTS.md):
# two investigations are only directly comparable within one class.

