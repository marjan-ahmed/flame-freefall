# Render Blueprint for ksor serve (the MCP door) — a free-tier alternative
# to Fly.io that needs no payment method on file. Uses the same root
# Dockerfile Fly's fly.toml points at (see that file's own comments for
# what the image does and why KSOR_AUTH=disabled-public is required on a
# public bind).
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file and creates the service; you'll be prompted for the
# `sync: false` secrets (same values as your local .env, except
# KSOR_SNAPSHOT_KEYS — generate a fresh one with `openssl rand -hex 32`,
# it's not in .env) since Blueprints never store secret values in the repo.
#
# Free-tier tradeoff: the service sleeps after 15 min idle and takes a few
# seconds to wake on the next request — fine for a door only hit when
# someone's actually chatting, not fine if you need guaranteed low latency.

services:
  - type: web
    name: flame-freefall-ksor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: KSOR_AUTH
        value: disabled-public
      - key: KSOR_DB_URL
        sync: false
      # Set this to the deployed Sentence Transformers service endpoint.
      - key: SENTENCE_TRANSFORMERS_BASE_URL
        sync: false
      # Use the same bearer token configured on the embeddings service.
      - key: SENTENCE_TRANSFORMERS_API_TOKEN
        sync: false
      # Without this, a search's snapshot pin is unverifiable across
      # restarts/redeploys (ephemeral per-process key) — read silently
      # drops to the active generation instead of the one that was
      # searched. ksor's own deploying.md flags this as a soft failure
      # with no error and no log line, so it's easy to miss.
      - key: KSOR_SNAPSHOT_KEYS
        sync: false
