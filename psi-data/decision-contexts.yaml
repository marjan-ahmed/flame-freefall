    doc: knowledge/investigations/droplet-combustion/cfi
    quote: >-
      FLEX series of experiments showed for the first time that quasi-steady stable flames can be established surrounding a droplet in microgravity under certain conditions, without a visible flame at temperatures in the range of 700 to 900 K
    rationale: Non-visible droplet flames motivate checking detection modalities; this is not a detector performance test or an alarm specification.
    checked_by: process:decision-mapping-check-v1
    checked_at: 2026-11-02T12:04:35Z
  - investigation: cfi
    job: suppression
    relevance: indirect
    doc: knowledge/investigations/droplet-combustion/cfi
    quote: >-
      Because cool-flame chemistry depends on fuel structure, pressure and
      temperature, CFI tested three fuel combinations at ambient pressures up to 5
      atmospheres, with and without helium.
    rationale: Cool-flame persistence and gas-composition dependence provide mechanistic context for extinction research, without demonstrating a selected suppressant.
    checked_by: process:decision-mapping-check-v1
    checked_at: 2026-11-02T12:04:35Z
